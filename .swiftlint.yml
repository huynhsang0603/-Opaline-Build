disabled_rules:
  - shorthand_optional_binding
  - type_contents_order

custom_rules:
  no_debug_nslog:
    name: "No NSLog"
    regex: "\\bNSLog\\s*\\("
    message: "Use a structured logger instead of NSLog."
    severity: error

  todo_requires_ticket:
    name: "TODO Requires Ticket"
    regex: "(TODO|FIXME)(?!\\([A-Z]+-\\d+\\))"
    message: "TODO and FIXME must reference a ticket, for example TODO(PROJ-123)."
    severity: error
identifier_name:
  min_length:
    warning: 2
    error: 2
  excluded:
    - id
    - cx
    - cy
    - ex
    - ey
    - sz
    - px
    - ac
line_length:
  warning: 200 # Đổi mức cảnh báo lên 200 ký tự
  error: 300   # Chỉ chặn build nếu dòng code dài quá 300 ký tự
  ignores_comments: true # Bỏ qua không tính độ dài đối với các dòng ghi chú (comments)
  ignores_urls: true     # Bỏ qua không tính độ dài đối với các đường link URL
