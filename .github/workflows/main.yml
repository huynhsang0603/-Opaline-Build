name: Build Opaline iPad Air 1 No Crash

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    # 1. Đổi sang macos-15 để lấy Xcode 16 xử lý lỗi Format (77)
    runs-on: macos-15

    steps:
      - name: Lay ma nguon tu Github
        uses: actions/checkout@v4

      # 2. Kích hoạt Xcode 16 để khớp với định dạng project mới
      - name: Kich hoat Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      # 3. Ép định dạng file project về bản cũ hơn để tránh xung đột cấu trúc
      - name: Ha cap dinh dang Xcode Project Format
        run: |
          find . -name "project.pbxproj" -exec sed -i '' 's/objectVersion = 77;/objectVersion = 56;/g' {} +

      - name: Fix loi thieu file Local.xcconfig
        run: |
          mkdir -p Config
          touch Config/Local.xcconfig
          echo "// Local overrides" > Config/Local.xcconfig

      - name: Can thiep sau va ep gia tri thuc thi phu hop iOS 10.3
        run: |
          # Đưa toàn bộ cấu hình dự án Xcode về đúng Target iOS 10.3 gốc
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.5;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 16.0;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 17.0;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 9.3;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
          
          # Tắt bắt buộc chứng chỉ bảo mật của Apple để tránh lỗi trên máy ảo đám mây
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} +
          
          # Vô hiệu hóa SwiftLint và Set Build Number gây lỗi tiến trình dịch mã
          find . -name "project.pbxproj" -exec sed -i '' 's/shellScript = ".*swiftlint.*";/shellScript = "echo SwiftLint Disabled";/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/shellScript = ".*build_number.*";/shellScript = "echo Build Number Disabled";/g' {} +

      - name: Cai dat thu vien CocoaPods
        run: |
          if [ -f Podfile ]; then
            pod repo update
            pod install
          fi

      - name: Bien dich NATIVE bang SDK va dong goi IPA
        run: |
          chmod +x scripts/*.sh || true
          chmod +x *.sh || true
          
          # Thay thế biến env trống bằng tham số chuẩn 'iphoneos' để Xcode tự nhận diện SDK
          if [ -d "Opaline.xcworkspace" ]; then
            xcodebuild archive \
              -workspace Opaline.xcworkspace \
              -scheme Opaline \
              -configuration Release \
              -sdk iphoneos \
              -archivePath $HOME/Opaline.xcarchive \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild archive \
              -project Opaline.xcodeproj \
              -scheme Opaline \
              -configuration Release \
              -sdk iphoneos \
              -archivePath $HOME/Opaline.xcarchive \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi
          
          # Tiến hành đóng gói file .ipa chuẩn cấu trúc Payload sạch
          mkdir -p Payload
          cp -r $HOME/Opaline.xcarchive/Products/Applications/Opaline.app Payload/
          zip -r Opaline_Native_iOS10.3.ipa Payload/

      - name: Tai file IPA thanh pham ve Github cho phep download
        uses: actions/upload-artifact@v4
        with:
          name: Opaline_iOS10.3_Build
          path: Opaline_Native_iOS10.3.ipa
