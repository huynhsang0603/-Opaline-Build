name: Build Opaline iPad Air 1

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-15

    steps:
    - name: Lay ma nguon tu Github
      uses: actions/checkout@v4

    - name: Kiem tra phien ban Xcode co san
      run: |
        xcodebuild -version

    - name: Ep cau hinh target và fix loi kien truc Framework
      run: |
        # Đưa toàn bộ cấu hình dự án Xcode về iOS 10.3 thay vì iOS 12 hay 14.5
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.5;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 9.3;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        
        # Sửa cấu hình để bỏ qua xác thực chữ ký mã của Apple trên máy ảo, giúp xcodebuild chạy trơn tru không đòi chứng chỉ thật
        find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' {} +

    - name: Don dep bo nho dem va Bien dich dong goi
      run: |
        chmod +x scripts/*.sh
        chmod +x *.sh
        
        # Thực hiện lệnh dọn dẹp cache cũ của Xcode trước khi biên dịch nhằm loại bỏ lỗi phantom dữ liệu
        xcodebuild clean -project Opaline.xcodeproj -scheme Opaline 2>/dev/null || true
        
        # Chạy script đóng gói chính thức của bạn
        ./make_ipa.sh || ./make_deb.sh

    - name: Tai file IPA thanh pham ve Github
      uses: actions/upload-artifact@v4
      with:
        name: Opaline-iOS10.3-ThanhPham
        path: |
          *.ipa
          *.deb
