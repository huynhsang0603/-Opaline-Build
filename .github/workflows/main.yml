name: Build Opaline Native iOS 10

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14

    steps:
      - name: Lay ma nguon tu Github
        uses: actions/checkout@v4

      - name: Kiem tra phien ban Xcode co san
        run: xcodebuild -version

      - name: Tai va giai nen thu cong SDK iOS 10.3
        run: |
          mkdir -p $HOME/SDKs
          # Tải bộ SDK chuẩn định dạng tar.gz từ okanon Repo công đồng
          curl -L -o $HOME/SDKs/iPhoneOS10.3.sdk.tar.gz https://github.com/okanon/iPhoneOS.sdk/releases/download/v0.0.1/iPhoneOS10.3.sdk.tar.gz
          cd $HOME/SDKs
          tar -xzf iPhoneOS10.3.sdk.tar.gz
          # Kiểm tra cấu trúc thư mục để đảm bảo giải nén thành công
          ls -la $HOME/SDKs/iPhoneOS10.3.sdk

      - name: Fix loi thieu file Local.xcconfig
        run: |
          mkdir -p Config
          touch Config/Local.xcconfig
          echo "// Local overrides" > Config/Local.xcconfig

      - name: Ep cau hinh target nguon ve iOS 10.3
        run: |
          # Đưa cấu hình Deployment Target trong project file về iOS 10.3
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.5;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 9.3;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
          
          # Tắt xác thực chứng chỉ ký mã để chạy trơn tru trên máy ảo
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} +
          
          # Vô hiệu hóa SwiftLint và Set Build Number gây đứt tiến trình dịch mã
          find . -name "project.pbxproj" -exec sed -i '' 's/shellScript = ".*swiftlint.*";/shellScript = "echo SwiftLint Disabled";/g' {} +
          find . -name "project.pbxproj" -exec sed -i '' 's/shellScript = ".*build_number.*";/shellScript = "echo Build Number Disabled";/g' {} +

      - name: Cai dat thu vien CocoaPods
        run: |
          if [ -f Podfile ]; then
            pod repo update
            pod install
          fi

      - name: Bien dich bang duong dan SDK vat ly va dong goi IPA
        run: |
          chmod +x scripts/*.sh
          chmod +x *.sh
          
          # Định nghĩa biến đường dẫn tuyệt đối tới bộ SDK iOS 10.3 vừa giải nén
          SDK_PATH="$HOME/SDKs/iPhoneOS10.3.sdk"
          
          # Ép tham số -sdk trỏ thẳng vào đường dẫn thư mục vật lý để vượt qua lỗi cấm định vị của Xcode
          if [ -d "Opaline.xcworkspace" ]; then
            xcodebuild archive \
              -workspace Opaline.xcworkspace \
              -scheme Opaline \
              -configuration Release \
              -sdk "$SDK_PATH" \
              -archivePath $HOME/Opaline.xcarchive \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild archive \
              -project Opaline.xcodeproj \
              -scheme Opaline \
              -configuration Release \
              -sdk "$SDK_PATH" \
              -archivePath $HOME/Opaline.xcarchive \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO
          fi
          
          # Đóng gói sản phẩm cấu trúc Payload chuẩn của file IPA
          mkdir -p Payload
          cp -r $HOME/Opaline.xcarchive/Products/Applications/Opaline.app Payload/
          zip -r Opaline_Native_iOS10.3.ipa Payload/

      - name: Tai file IPA thanh pham ve Github cho phep download
        uses: actions/upload-artifact@v4
        with:
          name: Opaline-Native-iOS10.3
          path: "*.ipa"
