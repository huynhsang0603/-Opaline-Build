name: Build Opaline Native iOS 10

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14 # Sử dụng máy ảo chip M-series để chạy ngay lập tức không nghẽn hàng đợi

    steps:
    - name: Lay ma nguon tu Github
      uses: actions/checkout@v4

    - name: Tai va nap thu thu cong SDK iOS 10.3 de sua loi Crash tuc thi
      run: |
        # Tải bộ SDK iOS 10.3 chuẩn từ kho lưu trữ cộng đồng về máy ảo
        curl -L -o iOS10.3.sdk.tar.xz https://github.com 2>/dev/null || \
        curl -L -o iOS10.3.sdk.tar.xz https://englemere.com
        
        # Giải nén và nạp trực tiếp vào thư mục SDK của Xcode trên máy ảo
        mkdir -p $HOME/SDKs
        tar -xf iOS10.3.sdk.tar.xz -C $HOME/SDKs/
        
        # Tạo liên kết tượng trưng vào cấu trúc Xcode để trình biên dịch nhận diện được SDK gốc iOS 10
        XCODE_PATH=$(xcode-select -p)
        sudo ln -s $HOME/SDKs/iPhoneOS10.3.sdk $XCODE_PATH/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS10.3.sdk

    - name: Ep cau hinh target nguon ve iOS 10.3
      run: |
        # Ép tất cả các tệp cấu hình của dự án sử dụng đúng bộ SDK và Deployment Target là 10.3
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.5;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 9.3;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        
        # Vô hiệu hóa các tính năng kiểm tra mã lỗi gây đứng tiến trình trên máy ảo
        find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/shellScript = ".*swiftlint.*";/shellScript = "echo SwiftLint Disabled";/g' {} +

    - name: Cai dat thu vien CocoaPods
      run: |
        if [ -f Podfile ]; then
          pod repo update
          pod install
        fi

    - name: Bien dich NATIVE bang SDK iOS 10.3 va dong goi IPA
      run: |
        chmod +x scripts/*.sh
        chmod +x *.sh
        
        # Thực hiện biên dịch Archive bằng cách ép cứng tham số sử dụng bộ SDK iPhoneOS10.3 vừa nạp
        if [ -d "Opaline.xcworkspace" ]; then
          xcodebuild archive \
            -workspace Opaline.xcworkspace \
            -scheme Opaline \
            -configuration Release \
            -sdk iphoneos10.3 \
            -archivePath $HOME/Opaline.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        else
          xcodebuild archive \
            -project Opaline.xcodeproj \
            -scheme Opaline \
            -configuration Release \
            -sdk iphoneos10.3 \
            -archivePath $HOME/Opaline.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        fi

        # Gom gói cấu trúc thư mục ứng dụng thành file .ipa sạch hoàn chỉnh
        mkdir -p Payload
        cp -r $HOME/Opaline.xcarchive/Products/Applications/Opaline.app Payload/
        zip -r Opaline_Native_iOS10.3.ipa Payload/

    - name: Xuat file IPA ve muc san pham Github
      uses: actions/upload-artifact@v4
      with:
        name: Opaline-Native-iOS10.3
        path: |
          *.ipa
