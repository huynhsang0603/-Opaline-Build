name: Build Opaline iPad Air 1

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-15 # Chạy trực tiếp trên máy ảo macos-15 để hoạt động ngay lập tức không nghẽn hàng đợi

    steps:
    - name: Lay ma nguon tu Github
      uses: actions/checkout@v4

    - name: Thiet lap phien ban Xcode thich hop
      run: |
        # Kiểm tra phiên bản Xcode mặc định trên máy ảo để đồng bộ hóa
        xcodebuild -version

    - name: Fix loi thieu file Local.xcconfig tren Github
      run: |
        # Tạo thư mục Config và tệp Local.xcconfig trống để vượt qua lỗi gãy cấu trúc thư mục
        mkdir -p Config
        touch Config/Local.xcconfig
        echo "// Local overrides" > Config/Local.xcconfig

    - name: Ep ha cau hinh va cho phep build legacy targets
      run: |
        # 1. Ép toàn bộ các tệp cấu hình dự án về Deployment Target iOS 10.3
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.5;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 9.3;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        
        # 2. Tắt tất cả các yêu cầu kiểm tra chứng chỉ nghiêm ngặt của Apple trên môi trường đám mây
        find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} +

        # 3. Vô hiệu hóa SwiftLint và Set Build Number để tránh bị Xcode 16 quét lỗi đứt tiến trình
        find . -name "project.pbxproj" -exec sed -i '' 's/shellScript = ".*swiftlint.*";/shellScript = "echo SwiftLint Disabled";/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/shellScript = ".*build_number.*";/shellScript = "echo Build Number Disabled";/g' {} +

    - name: Cai dat thu vien CocoaPods con thieu
      run: |
        if [ -f Podfile ]; then
          pod repo update
          pod install
        fi

    - name: Dung lenh Archive tao thu muc ung dung va dong goi IPA
      run: |
        chmod +x scripts/*.sh
        chmod +x *.sh
        
        # Biên dịch mã nguồn sạch ra thư mục xcarchive độc lập bằng cách chèn tham số bỏ qua giới hạn SDK cũ
        if [ -d "Opaline.xcworkspace" ]; then
          xcodebuild archive \
            -workspace Opaline.xcworkspace \
            -scheme Opaline \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $HOME/Opaline.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
        else
          xcodebuild archive \
            -project Opaline.xcodeproj \
            -scheme Opaline \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $HOME/Opaline.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
        fi

        # Tạo cấu trúc thư mục Payload và di chuyển tệp .app đã build vào
        mkdir -p Payload
        cp -r $HOME/Opaline.xcarchive/Products/Applications/Opaline.app Payload/
        
        # Ép hạ thông số hệ thống yêu cầu trực tiếp vào nhân Info.plist thành công của ứng dụng
        plutil -replace MinimumOSVersion -string "10.3" Payload/Opaline.app/Info.plist 2>/dev/null || true
        
        # Nén zip toàn bộ Payload thành file .ipa hoàn chỉnh
        zip -r Opaline_iPadAir1_iOS10.3.ipa Payload/

    - name: Tai file IPA thanh pham ve Github cho phep download
      uses: actions/upload-artifact@v4
      with:
        name: Opaline-iOS10.3-iPadAir1
        path: |
          *.ipa
            
