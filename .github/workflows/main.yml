     name: Build Opaline Native iOS 10

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build_ios:
    runs-on: macos-14 # Chạy ngay lập tức trên máy ảo macOS 14

    steps:
    - name: Lay ma nguon tu Github
      uses: actions/checkout@v4

    - name: Kiem tra phien ban Xcode co san
      run: |
        xcodebuild -version

    - name: Tai va nap thu cong SDK iOS 10.3 tu link kho luu tru chuan
      run: |
        mkdir -p $HOME/SDKs
        
        # Tải bộ SDK iOS 10.3 chính thức từ máy chủ lưu trữ XcodeLegacy uy tín
        curl -L -o $HOME/SDKs/iPhoneOS10.3.sdk.tar.gz https://github.com || \
        curl -L -o $HOME/SDKs/iPhoneOS10.3.sdk.tar.gz https://sdks.website
        
        # Tiến hành giải nén file định dạng tar.gz sạch
        cd $HOME/SDKs
        tar -xzf iPhoneOS10.3.sdk.tar.gz
        
        # Tạo liên kết tượng trưng trực tiếp vào Xcode của máy ảo để kích hoạt SDK iOS 10 gốc
        XCODE_PATH=$(xcode-select -p)
        sudo ln -s $HOME/SDKs/iPhoneOS10.3.sdk $XCODE_PATH/Platforms/iPhoneOS.platform/Developer/SDKs/iPhoneOS10.3.sdk
        
        # Xác nhận Xcode đã nhận diện được bộ SDK cổ điển thành công
        xcodebuild -showsdks

    - name: Fix loi thieu file Local.xcconfig tren Github
      run: |
        mkdir -p Config
        touch Config/Local.xcconfig
        echo "// Local overrides" > Config/Local.xcconfig

    - name: Ep cau hinh target nguon ve iOS 10.3
      run: |
        # Đưa toàn bộ cấu hình dự án Xcode về iOS 10.3 native thay vì iOS 12 hay 14.5
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 12.0;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 14.5;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = 9.3;/IPHONEOS_DEPLOYMENT_TARGET = 10.3;/g' {} +
        
        # Tắt kiểm tra chứng chỉ ký mã trên môi trường đám mây
        find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGNING_ALLOWED = YES;/CODE_SIGNING_ALLOWED = NO;/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} +

        # Vô hiệu hóa SwiftLint và Set Build Number gây lỗi tiến trình dịch mã
        find . -name "project.pbxproj" -exec sed -i '' 's/shellScript = ".*swiftlint.*";/shellScript = "echo SwiftLint Disabled";/g' {} +
        find . -name "project.pbxproj" -exec sed -i '' 's/shellScript = ".*build_number.*";/shellScript = "echo Build Number Disabled";/g' {} +

    - name: Cai dat thu vien CocoaPods con thieu
      run: |
        if [ -f Podfile ]; then
          pod repo update
          pod install
        fi

    - name: Bien dich NATIVE bang SDK iOS 10.3 va dong goi IPA
      run: |
        chmod +x scripts/*.sh
        chmod +x *.sh
        
        # Ép Xcode biên dịch mã nguồn sạch dựa trên nhân SDK iPhoneOS10.3 vừa nạp
        if [ -d "Opaline.xcworkspace" ]; then
          xcodebuild archive \
            -workspace Opaline.xcworkspace \
            -scheme Opaline \
            -configuration Release \
            -sdk iphoneos10.3 \
            -archivePath $HOME/Opaline.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        else
          xcodebuild archive \
            -project Opaline.xcodeproj \
            -scheme Opaline \
            -configuration Release \
            -sdk iphoneos10.3 \
            -archivePath $HOME/Opaline.xcarchive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        fi

        # Thiết lập cấu trúc thư mục Payload và nén thành tệp .ipa thành phẩm sạch
        mkdir -p Payload
        cp -r $HOME/Opaline.xcarchive/Products/Applications/Opaline.app Payload/
        zip -r Opaline_Native_iOS10.3.ipa Payload/

    - name: Tai file IPA thanh pham ve Github cho phep download
      uses: actions/upload-artifact@v4
      with:
        name: Opaline-Native-iOS10.3
        path: |
          *.ipa
     
