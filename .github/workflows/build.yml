name: Build iOS IPA
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run Build Script
        env:
          NO_LINT: "1"
          DISABLE_SWIFTLINT: "true"
        run: |
          chmod +x ./make_ipa.sh
          ./make_ipa.sh

